name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -v
      - run: python run.py verify --output outputs/verify
      - run: python run.py figures --output outputs/figures
      - run: python run.py prenatal --output outputs/prenatal
      - run: python run.py score --output outputs/scores.csv
      - uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: outputs/
          retention-days: 30
