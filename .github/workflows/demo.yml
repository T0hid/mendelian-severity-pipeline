name: Run pipeline demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the documented review environment
        run: docker build --tag severity-demo .
      - name: Check original training inputs
        run: docker run --rm --network none -v "$PWD:/work" -w /work severity-demo python run.py --check-inputs
      - name: Run regression tests
        run: |
          docker run --rm --network none -v "$PWD:/work" -w /work severity-demo python -m unittest discover -s src/tests -v
          docker run --rm --network none -v "$PWD:/work" -w /work severity-demo python -m unittest discover -s tests -v
      - name: Run predictions, verification and publication plotting
        run: docker run --rm --network none -e MPLBACKEND=Agg -v "$PWD:/work" -w /work severity-demo python run.py
      - name: Record the resolved environment
        run: docker run --rm --network none -v "$PWD:/work" -w /work severity-demo sh -c 'python -m pip freeze > results/environment.txt'
      - name: Save results, figures and source data
        uses: actions/upload-artifact@v7
        with:
          name: severity-demo-results
          path: results/
          if-no-files-found: error
          retention-days: 30
